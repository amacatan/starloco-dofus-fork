display_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off
date.timezone = Europe/Paris
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 1800
post_max_size = 64K
max_input_vars = 30
max_execution_time = 15
memory_limit = 128M
