user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 30;
  server_tokens off;
  client_max_body_size 64k;

  limit_req_zone $binary_remote_addr zone=registration:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=feed_api:10m rate=90r/m;
  limit_req_zone $binary_remote_addr zone=admin_login:10m rate=6r/m;
  limit_req_zone $binary_remote_addr zone=admin_api:10m rate=60r/m;
  limit_req_status 429;

  server {
    listen 80;
    server_name _;
    root /src/public;
    index index.php;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = / {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /index.php {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /register.php {
      limit_req zone=registration burst=8 nodelay;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/register.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /players {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/players.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /player {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/player.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /api/feed.php {
      limit_req zone=feed_api burst=30 nodelay;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/api/feed.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /health.php {
      access_log off;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/health.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /admin { return 308 /admin/; }

    location = /admin/ {
      allow 127.0.0.1;
      allow ::1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 100.64.0.0/10;
      deny all;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /admin/login {
      allow 127.0.0.1;
      allow ::1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 100.64.0.0/10;
      deny all;
      limit_req zone=admin_login burst=4 nodelay;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/admin/login.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /admin/logout {
      allow 127.0.0.1;
      allow ::1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 100.64.0.0/10;
      deny all;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/admin/logout.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /admin/player {
      allow 127.0.0.1;
      allow ::1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 100.64.0.0/10;
      deny all;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/admin/player.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /admin/action {
      allow 127.0.0.1;
      allow ::1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 100.64.0.0/10;
      deny all;
      limit_req zone=admin_api burst=20 nodelay;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/admin/action.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location = /admin/api/items {
      allow 127.0.0.1;
      allow ::1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 100.64.0.0/10;
      deny all;
      limit_req zone=admin_api burst=30 nodelay;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/admin/api/items.php;
      fastcgi_pass 127.0.0.1:9000;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }

    location /lang/ {
      alias /src/lang/;
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/data/maps/(?<map_id>[0-9]+)_[0-9]+X\.swf$ {
      root /src;
      try_files $uri @map_data_fallback;
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }

    location @map_data_fallback {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /src/public/map-data.php;
      fastcgi_param QUERY_STRING map_id=$map_id;
      fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /app/ { deny all; }
    location ^~ /api/ { return 404; }
    location ^~ /admin/ { return 404; }
    location = /cli-create-account.php { deny all; }
    location = /cli-social-worker.php { deny all; }
    location = /cli-social-health.php { deny all; }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location / { return 404; }
  }
}
